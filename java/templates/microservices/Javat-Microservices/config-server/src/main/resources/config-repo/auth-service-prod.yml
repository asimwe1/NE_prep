# Production configuration for auth-service

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/authdb_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Strict JWT expiration for production
jwt:
  access-token:
    expiration: 900000      # 15 minutes
  refresh-token:
    expiration: 604800000   # 7 days

logging:
  level:
    com.microservices.authservice: INFO
  file:
    name: logs/auth-service.log
    max-size: 10MB
    max-history: 30
