# Development configuration for auth-service

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/javat_authdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Relaxed JWT expiration for development
jwt:
  access-token:
    expiration: 3600000   # 1 hour (longer for development)
  refresh-token:
    expiration: 2592000000  # 30 days

logging:
  level:
    com.microservices.authservice: DEBUG
    org.springframework.security: DEBUG
