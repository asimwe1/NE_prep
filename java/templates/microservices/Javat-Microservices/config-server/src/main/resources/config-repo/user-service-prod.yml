# Production configuration for user-service

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/userdb_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.microservices.userservice: INFO
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 30
