spring:
  application:
    name: api-gateway
  
  cloud:
    config:
      # Fetch configuration from Config Server
      uri: http://localhost:8888
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
  
  profiles:
    active: dev

# Eureka configuration (can be overridden by Config Server)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
