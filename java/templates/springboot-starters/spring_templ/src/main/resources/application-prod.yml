spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/templatedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.template: INFO
    org.springframework.security: WARN

app:
  email:
    delivery: ${EMAIL_DELIVERY:smtp}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:true}
