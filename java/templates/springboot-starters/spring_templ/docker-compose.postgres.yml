version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: springboot-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - springboot_template_postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

volumes:
  springboot_template_postgres_data:
