version: '3.9'

services:
  db:
    image: postgres:15
    container_name: springboot-template-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: templatedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: springboot-template-app
    container_name: springboot-template-app
    depends_on:
      - db
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/templatedb
    restart: unless-stopped

volumes:
  postgres_data:
