spring.application.name=erp_system

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/erp_system}
spring.datasource.username=${DB_USERNAME:erp_user}
spring.datasource.password=${DB_PASSWORD:erp_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-value-please}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.institution.name=${INSTITUTION_NAME:Government of Rwanda}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

springdoc.swagger-ui.path=/swagger-ui.html
