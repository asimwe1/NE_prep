version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: utility-billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: utility_billing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - utility_billing_postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

volumes:
  utility_billing_postgres_data:
